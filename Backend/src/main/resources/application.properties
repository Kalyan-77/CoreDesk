spring.application.name=CoreDesk
spring.datasource.url=jdbc:mysql://localhost:3306/lifedashboard
spring.datasource.username = root
spring.datasource.password = Kalyan@123

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true



# Session timeout
server.servlet.session.timeout=10m

# Cookie security
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=false  
  # set true in production (HTTPS)
server.servlet.session.cookie.name=JSESSIONID
server.servlet.session.cookie.same-site=Strict  
  #? add this ? blocks CSRF

# Prevent session creation for static resources
spring.web.resources.add-mappings=false

#SameSite=Strict means the browser will never send the cookie on cross-site requests ? this blocks CSRF attacks on your session.